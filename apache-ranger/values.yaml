replicaCount: 1

hostAliases: []
# - ip: "127.0.0.1"
#   hostnames:
#     - "foo.local"
#     - "bar.local"

image:
  repository: apache/ranger
  tag: "2.8.0"
  pullPolicy: IfNotPresent

ranger:
  adminPassword: "StrongPass58"

service:
  type: ClusterIP # or LoadBalancer, NodePort
  port: 6080
  externalIPs: []

resources:
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

customCaCerts:
  enabled: false
  # Name of a Secret whose keys are PEM certificate files (e.g. trino-ca.crt).
  # All certs are imported into the JVM truststore so Ranger can connect over TLS.
  secretName: ""

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: ranger.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 14.17.0-debian-12-r3
  auth:
    postgresPassword: postgrespass
    username: ranger
    password: rangerpass
    database: rangerdb
  primary:
    # Protect the (potentially slow, e.g. NFS-backed) DB initialization window.
    # Without this, the default livenessProbe kills the container ~90-120s after
    # start; on slow storage this happens mid-init, before the postgres/ranger
    # passwords are assigned. The half-written volume then permanently skips
    # credential setup on restart, causing "password authentication failed for
    # user postgres / User postgres has no password assigned".
    # The startupProbe gates liveness/readiness until init completes.
    startupProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 40 # ~30s + 40*15s ≈ 10 min budget for first-time init
    livenessProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    service:
      type: ClusterIP # or LoadBalancer, NodePort
      port: 5432
      externalIPs: []
    resources:
      limits:
        cpu: 500m
        memory: 1024Mi
      requests:
        cpu: 250m
        memory: 512Mi
    persistence:
      enabled: true
      storageClass: "" # Use default storage class
      size: 8Gi
      accessModes:
        - ReadWriteOnce
